[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SIMPApy"
dynamic = ["version"]
description = "Normalized Single Sample Integrated Multiomics Pathway Analysis"
readme = "README.md"
authors = [
    {name = "Hasan Alsharoh", email = "hasanalsharoh@gmail.com"}
]
license = {text = "Apache License (2.0)"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
requires-python = ">=3.8"
dependencies = [
    "gseapy==1.1.3",
    "numpy>=1.23.5",
    "scipy>=1.14.0",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "plotly==5.24.1",
    "scikit-learn>=1.5.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.1",
    "ipywidgets==8.1.5",
    "pillow>=12.2.0"
]

[project.optional-dependencies]
# kaleido is only needed for static PNG export in create_interactive_plot.
# Capped <1.0: kaleido 1.x requires plotly>=6 and is incompatible with the
# pinned plotly 5.24.1. Install with:  pip install SIMPApy[export]
export = ["kaleido>=0.1.0,<1.0"]

[project.urls]
"Homepage" = "https://github.com/hasanalsharoh/SIMPApy"
"Bug Tracker" = "https://github.com/hasanalsharoh/SIMPApy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/SIMPApy"]

[tool.hatch.version]
path = "src/SIMPApy/__init__.py"