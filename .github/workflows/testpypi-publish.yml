name: Publish to TestPyPI

on:
  push:
    tags:
      # PEP 440 prereleases (e.g. v1.5.1a, v1.5.1a2, v1.5.1b1, v1.5.1rc1) -> TestPyPI.
      # NOTE: in GitHub filter patterns '*' is a standalone "zero+ chars" wildcard,
      # not "zero+ of the preceding class", so 'a[0-9]*' would REQUIRE a digit after
      # 'a' and miss a bare 'v1.5.1a'. List the bare and numbered forms explicitly.
      - 'v[0-9]+.[0-9]+.[0-9]+a'          # alpha, no number (v1.5.1a)
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'    # alpha, numbered (v1.5.1a2)
      - 'v[0-9]+.[0-9]+.[0-9]+b'          # beta
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc'         # release candidate
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
      - 'test-v*'                         # or an explicit test- prefix

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install build and twine
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Upload package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}